---
nagiosxi_force_install: false
nagiosxi_apache_services:
  RedHat: httpd
nagiosxi_log_path: /var/log/nagiosxi-install.log
nagiosxi_reboot_after_update: true
nagiosxi_reboot_timeout: 600
nagiosxi_ssh_services:
  RedHat: sshd
# Apache points straight at /etc/letsencrypt/live/ through the official Nagios XI
# script (tasks/ssl.yml): no copies under /usr/local/nagiosxi that drift out of
# sync, and no lineinfile over an ssl.conf that XI rewrites on its own. That is why
# no deploy files or copy hooks are needed here; the renewal deploy hook reloads
# httpd and that is enough.
nagiosxi_ssl_cert: ""
nagiosxi_ssl_conf: /etc/httpd/conf.d/ssl.conf
nagiosxi_ssl_key: ""
nagiosxi_ssl_script: /usr/local/nagiosxi/scripts/manage_ssl_config.sh
nagiosxi_src_url: https://assets.nagios.com/downloads/nagiosxi/2026/xi-2026R1.7.tar.gz
nagiosxi_staging_dir: /tmp/nagiosxi-install
nagiosxi_supported_distributions:
  - AlmaLinux
  - CentOS
  - OracleLinux
  - RedHat
  - Rocky
nagiosxi_update_packages: true
nagiosxi_url: "https://{{ inventory_hostname }}/nagiosxi/"
nagiosxi_verify_wizard: true
